version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: storage_postgres
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - storage_network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: storage_mysql
    environment:
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "testuser", "-ptestpass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - storage_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: storage_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./scripts/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - storage_network

  # MongoDB Document Database
  mongodb:
    image: mongo:5
    container_name: storage_mongodb
    environment:
      MONGO_INITDB_DATABASE: testdb
      MONGO_INITDB_ROOT_USERNAME: testuser
      MONGO_INITDB_ROOT_PASSWORD: testpass
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - storage_network

  # SQLite (for file-based testing)
  sqlite:
    image: alpine:latest
    container_name: storage_sqlite
    volumes:
      - sqlite_data:/data
      - ./scripts/sqlite-init.sql:/init.sql
    command: sh -c "apk add --no-cache sqlite && sqlite3 /data/test.db < /init.sql && tail -f /dev/null"
    networks:
      - storage_network

  # Test Runner Service
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: storage_test_runner
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - POSTGRES_DSN=postgres://testuser:testpass@postgres:5432/testdb?sslmode=disable
      - MYSQL_DSN=testuser:testpass@tcp(mysql:3306)/testdb?parseTime=true
      - REDIS_DSN=redis://redis:6379/0
      - MONGODB_DSN=mongodb://testuser:testpass@mongodb:27017/testdb
      - SQLITE_DSN=/data/test.db
    volumes:
      - .:/app
      - sqlite_data:/data
    working_dir: /app
    networks:
      - storage_network
    profiles:
      - test

  # Development Environment
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: storage_dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - POSTGRES_DSN=postgres://testuser:testpass@postgres:5432/testdb?sslmode=disable
      - REDIS_DSN=redis://redis:6379/0
    volumes:
      - .:/app
      - go_cache:/go/pkg/mod
    working_dir: /app
    ports:
      - "8080:8080"
    networks:
      - storage_network
    profiles:
      - dev

  # Monitoring and Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: storage_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - storage_network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: storage_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - storage_network
    profiles:
      - monitoring

  # Database Administration Tools
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: storage_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - storage_network
    profiles:
      - admin

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: storage_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: testuser
      PMA_PASSWORD: testpass
    ports:
      - "8081:80"
    networks:
      - storage_network
    profiles:
      - admin

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: storage_redis_commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8082:8081"
    networks:
      - storage_network
    profiles:
      - admin

  mongo-express:
    image: mongo-express:latest
    container_name: storage_mongo_express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: testuser
      ME_CONFIG_MONGODB_ADMINPASSWORD: testpass
      ME_CONFIG_MONGODB_URL: mongodb://testuser:testpass@mongodb:27017/
    ports:
      - "8083:8081"
    networks:
      - storage_network
    profiles:
      - admin

volumes:
  postgres_data:
    driver: local
  mysql_data:
    driver: local
  redis_data:
    driver: local
  mongodb_data:
    driver: local
  sqlite_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  pgadmin_data:
    driver: local
  go_cache:
    driver: local

networks:
  storage_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
