[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hybridcache-storage"
version = "1.0.0"
description = "A comprehensive, high-performance database abstraction library for Python with async support"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "HybridCache.io Team", email = "support@hybridcache.io" }]
keywords = ["database", "async", "postgresql", "mongodb", "sql", "abstraction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # 0.31 is the first release with Python 3.14 wheels.
    "asyncpg>=0.31",
    # 4.13 is the first release with the GA asyncio API (AsyncMongoClient),
    # which replaces Motor.
    "pymongo>=4.13",
]

[project.urls]
Homepage = "https://github.com/AnandSGit/HybridCache.io/tree/Main/python"
Repository = "https://github.com/AnandSGit/HybridCache.io"
Issues = "https://github.com/AnandSGit/HybridCache.io/issues"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=8",
    "pytest-asyncio>=1",
    "pytest-cov>=6",
    "ruff>=0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/storage"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a live database (POSTGRES_DSN / MONGODB_URI); skipped when unset",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
# asyncpg ships no type information.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "A", "BLE", "PT", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and use throwaway credentials.
"tests/**" = ["S101", "S105", "S106"]
# Examples use throwaway demo credentials.
"examples/**" = ["S105", "S106"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
exclude_also = [
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
