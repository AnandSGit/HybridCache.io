# golangci-lint v2 configuration: https://golangci-lint.run/docs/configuration/
# Run it with `make lint` (golangci-lint v2.15.0).
#
# A small, high-signal set for a library: bugs, error handling, security and a
# few strong Go idioms. Linters that only enforce style are left out.
version: "2"

run:
  # Lint the integration tests too; they are behind this build tag.
  build-tags:
    - integration

linters:
  default: none
  enable:
    - errcheck # unchecked errors
    - errorlint # error comparisons and wrapping that defeat errors.Is/As
    - gocritic # diagnostic checks only (see settings)
    - gosec # security problems
    - govet # go vet, plus nilness and unusedwrite
    - ineffassign # assignments whose value is never used
    - misspell # misspelled English words
    - revive # a few idioms staticcheck does not cover (see settings)
    - staticcheck # bugs, simplifications and selected style checks
    - unconvert # unnecessary type conversions
    - unused # unused code

  settings:
    errcheck:
      # Also report x.(T) without the ok result, which panics on a mismatch.
      check-type-assertions: true

    gocritic:
      # Exactly the checks tagged "diagnostic" (likely bugs), none of the
      # style, performance or opinionated ones.
      disable-all: true
      enabled-tags:
        - diagnostic

    gosec:
      excludes:
        - G104 # unhandled errors: errcheck reports these

    govet:
      enable:
        - nilness
        - unusedwrite

    revive:
      # Only these rules run. Rules that duplicate staticcheck or go vet
      # (error-strings, error-naming, error-return, errorf, dot-imports,
      # context-keys-type, time-naming, unreachable-code, empty-block) are
      # omitted.
      rules:
        - name: blank-imports
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T,*testing.B,testing.TB"
        - name: defer
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: unexported-return
        - name: var-naming

    staticcheck:
      checks:
        - all
        - -ST1000 # package comments
        - -ST1003 # initialisms in names (revive var-naming covers naming)
        - -ST1016 # consistent receiver names (revive receiver-naming)
        - -ST1020 # comment form on exported functions
        - -ST1021 # comment form on exported types
        - -ST1022 # comment form on exported variables
        - -QF* # quick-fix refactoring suggestions

  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: _test\.go
        linters:
          - gosec
        text: "G(101|404):" # test credentials; math/rand in tests
      - path: ^(cmd|examples)/
        linters:
          - gosec
        text: "G101:" # the examples' local development credentials

issues:
  # Report everything instead of the default 50 per linter / 3 per message.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/AnandSGit/HybridCache.io
