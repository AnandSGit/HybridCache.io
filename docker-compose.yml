# Local databases for developing and testing the Go and Python libraries.
#
#   make dev-up      # docker compose up -d --wait  (returns once both are healthy)
#   make dev-down    # docker compose down          (add -v to also delete the data)
#
# Connection strings matching these defaults (used by the integration tests
# and examples):
#
#   POSTGRES_DSN=postgres://testuser:testpass@localhost:5432/testdb?sslmode=disable
#   MONGODB_URI=mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
#
# PostgreSQL credentials can be overridden with POSTGRES_USER, POSTGRES_PASSWORD
# and POSTGRES_DB (in the environment or a .env file next to this file). They
# only take effect when the data volume is first created; update POSTGRES_DSN
# to match.
#
# MongoDB runs as a single-node replica set (rs0) because multi-document
# transactions require one; the healthcheck initiates the replica set on first
# start and reports healthy once this node is primary. MongoDB has no
# authentication here, so both ports are published on 127.0.0.1 only.

name: hybridcache

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-testuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testpass}
      POSTGRES_DB: ${POSTGRES_DB:-testdb}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18+ images keep data in a major-version subdirectory of
      # /var/lib/postgresql, so the volume is mounted there.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # Probe over TCP: during first-time initialization the entrypoint runs a
      # temporary server that only listens on the Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  mongodb:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
      # Declared as a volume by the image; named so that it is reused rather
      # than left behind as a new anonymous volume after each down/up.
      - mongodb_config:/data/configdb
    healthcheck:
      # Idempotent: initiates rs0 only if it has no configuration yet, then
      # fails until this node has been elected primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status(); } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }); }
          if (!db.hello().isWritablePrimary) { quit(1); }
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 1s

volumes:
  postgres_data:
  mongodb_data:
  mongodb_config:
